services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eicholtz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eicholtz}
      POSTGRES_DB: ${POSTGRES_DB:-eicholtz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eicholtz} -d ${POSTGRES_DB:-eicholtz}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_PORT: ${APP_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-eicholtz}:${POSTGRES_PASSWORD:-eicholtz}@db:5432/${POSTGRES_DB:-eicholtz}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-donttouchegoista@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-eicholtz-change-me-in-production}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/images:/app/public/images
      - ./dist:/app/dist
      - ./server:/app/server
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
